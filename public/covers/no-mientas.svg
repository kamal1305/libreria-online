<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="spineShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.22)"/>
      <stop offset="3%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="6%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFD2C0"/>
      <stop offset="100%" stop-color="#DFD2C0"/>
    </linearGradient>
  </defs>

  <!-- Base Cover -->
  <rect width="300" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border / book framing -->
  <rect x="14" y="14" width="272" height="422" rx="4" fill="none" stroke="#C9B9A3" stroke-width="1.5" opacity="0.6"/>
  <rect x="18" y="18" width="264" height="414" rx="2" fill="none" stroke="#C9B9A3" stroke-width="0.75" opacity="0.4"/>

  <!-- Genre Badge -->
  <g transform="translate(150, 60)">
    <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#C9B9A3" opacity="0.35"/>
    <text x="0" y="4" font-family="'Nunito Sans', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.12em" fill="#D47B84" text-anchor="middle">NOVELA</text>
  </g>

  <!-- Decorative separator ornament -->
  <path d="M120 115 Q150 125 180 115" stroke="#D47B84" stroke-width="1.2" fill="none" opacity="0.7"/>
  <circle cx="150" cy="118" r="2.5" fill="#D47B84"/>

  <!-- Title -->
  <g>
    <text x="150" y="185" font-family="'Fraunces', Georgia, serif" font-size="23" font-weight="600" fill="#3E352B" text-anchor="middle">No mientas</text>
  </g>

  <!-- Author separator -->
  <line x1="100" y1="290" x2="200" y2="290" stroke="#D47B84" stroke-width="1" opacity="0.5"/>

  <!-- Author -->
  <g>
    <text x="150" y="320" font-family="'Nunito Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.08em" fill="#D47B84" text-anchor="middle">ARTURO DEL BURGO</text>
  </g>

  <!-- Bottom Brand Seal: Más que libros -->
  <g transform="translate(150, 395)" opacity="0.85">
    <circle cx="0" cy="0" r="14" fill="#C9B9A3" opacity="0.4"/>
    <text x="0" y="4" font-size="12" text-anchor="middle">☕</text>
    <text x="0" y="24" font-family="'Nunito Sans', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.14em" fill="#3E352B" opacity="0.7" text-anchor="middle">MÁS QUE LIBROS</text>
  </g>

  <!-- Spine 3D Shadow -->
  <rect width="24" height="450" fill="url(#spineShade)"/>
</svg>